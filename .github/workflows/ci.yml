name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wishlist:wishlist@localhost:5432/wishlist_test
      TEST_DATABASE_URL: postgresql://wishlist:wishlist@localhost:5432/wishlist_test
      AUTH_SECRET: ci-test-auth-secret-min-32-chars-long
      NEXTAUTH_URL: http://localhost:3000
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Migrate test database
        run: npx prisma migrate deploy

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

  # E2E runs separately — enable when preview URL or local server in CI is ready
